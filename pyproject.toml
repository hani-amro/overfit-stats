[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "overfit-stats"
version = "0.1.0"
description = "Deflated Sharpe, PBO/CSCV and permutation tests -- tell whether a backtest found an edge or a coincidence."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Hani Amro", email = "hani.wael.amro@gmail.com" }]
keywords = ["backtesting", "overfitting", "sharpe-ratio", "quantitative-finance", "statistics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/hani-amro/overfit-stats"
Issues = "https://github.com/hani-amro/overfit-stats/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/overfit_stats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
